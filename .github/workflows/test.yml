name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - name: Lint package, benchmarks, and workspace tests
        run: ruff check src benchmarks qa/tests scripts/run_agent_demo.py
      - name: Type-check package interfaces
        run: mypy src/data_cleaning_skills
      - name: Enforce branch coverage gate
        run: python -m pytest -q --cov=data_cleaning_skills --cov-branch --cov-report=term-missing
      - name: Run cross-Skill QA audit
        run: python qa/run_qa.py

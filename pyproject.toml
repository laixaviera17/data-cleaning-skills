[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-cleaning-skills"
version = "0.1.0"
description = "Rule-driven, agent-callable data quality skills for CSV, JSON, and JSONL workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "lixiaohui" }]
keywords = ["data-cleaning", "data-quality", "agent-tools", "etl", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "jsonschema[format]>=4.22",
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/laixaviera17/data-cleaning-skills"
Documentation = "https://github.com/laixaviera17/data-cleaning-skills#readme"
Issues = "https://github.com/laixaviera17/data-cleaning-skills/issues"
Repository = "https://github.com/laixaviera17/data-cleaning-skills.git"

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
